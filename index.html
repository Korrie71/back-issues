<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Back Issues: a teletext detective story</title>
<meta name="description" content="Your neighbour has vanished and the Housing Office says he never lived there. A text detective story in six days, played on a state teletext screen. Dig through 22 years of back pages and find out where the lost go.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:type" content="website">
<meta property="og:title" content="Back Issues">
<meta property="og:description" content="A teletext detective story in six days. Search the back pages. Find out where the lost go.">
<meta property="og:url" content="https://korrie71.github.io/back-issues/">
<meta property="og:image" content="https://korrie71.github.io/back-issues/og.png">

<style>
/* Layout: the whole page is one television set tuned to a state teletext service.
   A 40x25 character screen drawn on a canvas with its own dot-matrix font, four coloured keys under it. Nothing else. */
:root{
  --off:#000000;      /* the set, and the room around it */
  --red:#ff0000;      /* the eight teletext colours, used by the keys */
  --green:#00ff00;
  --yellow:#ffff00;
  --blue:#0000ff;
  --key:#1c1c1c;      /* plain remote keys */
  --key-edge:#3a3a3a;
  --ink:#ffffff;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--off);color:var(--ink);margin:0;overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
.tv{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.wrap{position:relative;line-height:0;max-width:100%}
#scr{display:block;background:var(--off);max-width:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#kin{position:absolute;left:0;width:100%;border:0;padding:0;margin:0;background:transparent;color:transparent;caret-color:transparent;
  font-size:16px;opacity:.01;outline:none}
.keys{display:flex;gap:0;max-width:100%}
.fk{flex:1;height:26px;border:0;border-radius:0;padding:0;cursor:pointer;margin:0 3px}
.fk:active{filter:brightness(.7)}
.fk.r{background:var(--red)}.fk.g{background:var(--green)}.fk.y{background:var(--yellow)}.fk.b{background:var(--blue)}
.keys2{display:none;gap:6px;max-width:100%}
.xk{flex:1;height:40px;background:var(--key);border:1px solid var(--key-edge);border-radius:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.xk canvas{height:14px;width:auto}
.fk:focus-visible,.xk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;white-space:pre}
@media (pointer:coarse),(max-width:700px){
  .tv{justify-content:flex-start}
  .keys2{display:flex}
  .fk{height:36px}
}
</style>
</head>
<body>
<div class="tv" id="tv">
  <div class="wrap" id="wrap">
    <canvas id="scr" width="960" height="1000" aria-hidden="true"></canvas>
    <input id="kin" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="80" aria-label="Type a number to choose, then press Enter">
  </div>
  <div class="keys" id="keys">
    <button class="fk r" type="button" data-i="0" aria-label="Red key"></button>
    <button class="fk g" type="button" data-i="1" aria-label="Green key"></button>
    <button class="fk y" type="button" data-i="2" aria-label="Yellow key"></button>
    <button class="fk b" type="button" data-i="3" aria-label="Blue key"></button>
  </div>
  <div class="keys2" id="keys2">
    <button class="xk" type="button" id="kback" aria-label="Back"></button>
    <button class="xk" type="button" id="kkeys" aria-label="Keyboard"></button>
    <button class="xk" type="button" id="kenter" aria-label="Enter"></button>
  </div>
  <div class="sr" id="sr" aria-live="polite"></div>
</div>
<script>
"use strict";
/* ================= TELETEXT CORE: font, screen, layout ================= */
const $ = s => document.querySelector(s);
const TEST = /[?&]test/.test(location.search);
const CALM = TEST || matchMedia("(prefers-reduced-motion: reduce)").matches;     /* no wipes, rolls, glitches or flashing */
const COLS = 40, ROWS = 25, GW = 12, GH = 20, PH = 20;      /* PH: content rows on a page (screen rows 1..20) */
const K = 0, R = 1, G = 2, Y = 3, B = 4, M = 5, C = 6, W = 7;
const PAL = ["#000000", "#ff0000", "#00ff00", "#ffff00", "#0000ff", "#ff00ff", "#00ffff", "#ffffff"];

/* 5x7 dot-matrix alphabet, ASCII 32..126, five column bytes per character (bit 0 = top row) */
const FHEX =
 "0000000000" + "00005F0000" + "0007000700" + "147F147F14" + "242A7F2A12" + "2313086462" + "3649552250" + "0005030000" +
 "001C224100" + "0041221C00" + "14083E0814" + "08083E0808" + "0050300000" + "0808080808" + "0060600000" + "2010080402" +
 "3E5149453E" + "00427F4000" + "4261514946" + "2141454B31" + "1814127F10" + "2745454539" + "3C4A494930" + "0171090503" +
 "3649494936" + "064949291E" + "0036360000" + "0056360000" + "0814224100" + "1414141414" + "0041221408" + "0201510906" +
 "324979413E" + "7E1111117E" + "7F49494936" + "3E41414122" + "7F4141221C" + "7F49494941" + "7F09090901" + "3E4149497A" +
 "7F0808087F" + "00417F4100" + "2040413F01" + "7F08142241" + "7F40404040" + "7F020C027F" + "7F0408107F" + "3E4141413E" +
 "7F09090906" + "3E4151215E" + "7F09192946" + "4649494931" + "01017F0101" + "3F4040403F" + "1F2040201F" + "3F4038403F" +
 "6314081463" + "0708700807" + "6151494543" + "007F414100" + "0204081020" + "0041417F00" + "0402010204" + "4040404040" +
 "0001020400" + "2054545478" + "7F48444438" + "3844444420" + "384444487F" + "3854545418" + "087E090102" + "0C5252523E" +
 "7F08040478" + "00447D4000" + "2040443D00" + "7F10284400" + "00417F4000" + "7C04180478" + "7C08040478" + "3844444438" +
 "7C14141408" + "081414187C" + "7C08040408" + "4854545420" + "043F444020" + "3C4040207C" + "1C2040201C" + "3C4030403C" +
 "4428102844" + "0C5050503C" + "4464544C44" + "0008364100" + "00007F0000" + "0041360800" + "0804081008";
/* letters redrawn on nine rows so their tails hang below the line, plus a few signs the service needs */
const FOVER = {
  g: [".....", ".....", ".####", "#...#", "#...#", "#...#", ".####", "....#", ".###."],
  j: ["...#.", ".....", "..##.", "...#.", "...#.", "...#.", "...#.", "#..#.", ".##.."],
  p: [".....", ".....", "####.", "#...#", "#...#", "#...#", "####.", "#....", "#...."],
  q: [".....", ".....", ".####", "#...#", "#...#", "#...#", ".####", "....#", "....#"],
  y: [".....", ".....", "#...#", "#...#", "#...#", "#...#", ".####", "....#", ".###."],
  ",": [".....", ".....", ".....", ".....", ".....", "..#..", "..#..", ".#...", "....."],
  ";": [".....", ".....", "..#..", ".....", ".....", "..#..", "..#..", ".#...", "....."],
  "·": [".....", ".....", ".....", "..#..", ".....", ".....", ".....", ".....", "....."],
  "✓": [".....", ".....", "....#", "...#.", "#.#..", ".#...", ".....", ".....", "....."],
  "→": [".....", ".....", "..#..", "...#.", "#####", "...#.", "..#..", ".....", "....."]
};
const RAW = {}, GL = {};
function smooth(rows){
  /* 5x9 dots in a 6x10 cell, doubled to 12x20 with the diagonal joins filled in, the way a teletext decoder rounds its characters */
  const src = new Uint8Array(60);
  for (let r = 0; r < 9; r++) for (let c = 0; c < 5; c++) if ((rows[r] >> c) & 1) src[(r + 1) * 6 + c + 1] = 1;
  const g = (x, y) => (x >= 0 && x < 6 && y >= 0 && y < 10) ? src[y * 6 + x] : 0, out = new Uint8Array(240);
  for (let y = 0; y < 10; y++) for (let x = 0; x < 6; x++){
    if (g(x, y)){ const o = 2 * y * 12 + 2 * x; out[o] = out[o + 1] = out[o + 12] = out[o + 13] = 1; continue; }
    for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++){
      const sx = dx ? 1 : -1, sy = dy ? 1 : -1;
      if (g(x + sx, y) && g(x, y + sy) && !g(x + sx, y + sy)) out[(2 * y + dy) * 12 + 2 * x + dx] = 1;
    }
  }
  const runs = [];
  for (let y = 0; y < 20; y++){ let x = 0; while (x < 12){ if (out[y * 12 + x]){ let w = 1; while (x + w < 12 && out[y * 12 + x + w]) w++; runs.push([x, y, w]); x += w; } else x++; } }
  return runs;
}
(function buildFont(){
  for (let i = 0; i < 95; i++){
    const rows = [];
    for (let r = 0; r < 9; r++){ let s = 0; if (r < 7) for (let c = 0; c < 5; c++) if ((parseInt(FHEX.substr(i * 10 + c * 2, 2), 16) >> r) & 1) s |= 1 << c; rows.push(s); }
    RAW[String.fromCharCode(32 + i)] = rows;
  }
  for (const k in FOVER) RAW[k] = FOVER[k].map(s => [...s].reduce((a, ch, c) => a | ((ch === "#" ? 1 : 0) << c), 0));
  for (const k in RAW) GL[k] = smooth(RAW[k]);
})();
const clean = s => String(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, "-").replace(/…/g, "...");

/* ---------- cells and lines ---------- */
let LBG = K;
function line(bg){ const b = bg == null ? LBG : bg, l = []; for (let i = 0; i < COLS; i++) l.push({ch:" ", fg:W, bg:b, mo:-1}); return l; }
function wr(l, x, s, fg, ex){
  s = clean(s);
  for (let i = 0; i < s.length; i++){ const c = l[x + i]; if (!c) break; c.ch = s[i]; c.fg = fg; c.mo = -1; if (ex) Object.assign(c, ex); }
  return x + s.length;
}
/* mosaics: each cell is 2x3 blocks. grid is w x h of 0/1, w even, h a multiple of 3 */
function mosLines(grid, w, h, xoff, fgFn, bg, ex){
  const out = [];
  for (let cy = 0; cy < h / 3; cy++){
    const l = line(bg);
    for (let cxx = 0; cxx < w / 2; cxx++){
      let bits = 0;
      for (let b = 0; b < 6; b++){ const x = cxx * 2 + (b & 1), y = cy * 3 + (b >> 1); if (grid[y * w + x]) bits |= 1 << b; }
      const c = l[xoff + cxx]; if (!c) continue;
      c.mo = bits; c.fg = typeof fgFn === "function" ? fgFn(cxx, cy) : fgFn; if (ex) Object.assign(c, ex);
    }
    out.push(l);
  }
  return out;
}
function bigGrid(str){
  str = clean(str); const w = str.length * 6, g = new Uint8Array(w * 9);
  [...str].forEach((ch, i) => { const rows = RAW[ch] || RAW["?"]; for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if ((rows[r] >> c) & 1) g[(r + 1) * w + i * 6 + c] = 1; });
  return {g, w, h:9};
}
function bigText(str, fg, bg, ex){ const b = bigGrid(str); return mosLines(b.g, b.w, b.h, Math.max(0, Math.floor((COLS - b.w / 2) / 2)), fg, bg, ex); }
function drawGrid(w, h, fn){
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  x.fillStyle = "#000"; x.fillRect(0, 0, w, h); x.fillStyle = "#fff"; x.strokeStyle = "#fff"; fn(x);
  const d = x.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = d[i * 4] > 110 ? 1 : 0;
  return g;
}
function rng(seed){ let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

/* ---------- marked-up text to styled characters ---------- */
let MARK = [21, 42, 21, 42];
function chars(mk, fg){
  mk = clean(mk); const out = [], stack = [{fg}], re = /<(\/?)([a-z])(?: [qc]="([^"]*)")?>|\[mark\]/g; let m, last = 0;
  const push = t => { const s = stack[stack.length - 1]; for (const ch of t) out.push({ch, fg:s.fg, blk:ch === " " ? 0 : (s.blk || 0), fl:s.fl || 0}); };
  while ((m = re.exec(mk))){
    push(mk.slice(last, m.index)); last = re.lastIndex;
    if (m[0] === "[mark]"){ MARK.forEach(b => out.push({ch:" ", mo:b, fg:M})); continue; }
    if (m[1]){
      const s = stack.pop();
      if (s.k === 1){ const q = s.q || out.slice(s.start).map(c => c.ch).join(""); for (let i = s.start; i < out.length; i++) out[i].ln = {t:"s", q}; }
      if (s.k === 2) for (let i = s.start; i < out.length; i++) out[i].ln = {t:"c", cmd:s.q};
      continue;
    }
    const ns = Object.assign({}, stack[stack.length - 1], {k:0}), t = m[2];
    if (t === "k"){ ns.fg = C; ns.k = 1; ns.q = m[3] || null; ns.start = out.length; }
    else if (t === "a"){ ns.fg = C; ns.k = 2; ns.q = m[3] || ""; ns.start = out.length; }
    else if (t === "x") ns.blk = 1; else if (t === "y") ns.blk = 2;
    else if (t === "b") ns.fg = Y; else if (t === "g") ns.fg = G; else if (t === "m") ns.fg = M; else if (t === "c") ns.fg = C; else if (t === "r") ns.fg = R; else if (t === "w") ns.fg = W;
    else if (t === "f") ns.fl = 1;
    stack.push(ns);
  }
  push(mk.slice(last));
  return out;
}
function wrap(cs, width){
  const lines = []; let cur = [], word = [];
  const flush = () => {
    while (word.length > width){ if (cur.length){ lines.push(cur); cur = []; } lines.push(word.slice(0, width)); word = word.slice(width); }
    if (!word.length) return;
    if (cur.length && cur.length + 1 + word.length > width){ lines.push(cur); cur = []; }
    if (cur.length){ const sp = {ch:" ", fg:W, blk:0}; const a = cur[cur.length - 1].ln, b = word[0].ln; if (a && b && a.q === b.q && a.cmd === b.cmd) sp.ln = a; cur.push(sp); }
    cur = cur.concat(word); word = [];
  };
  for (const c of cs){ if (c.ch === "\n"){ flush(); lines.push(cur); cur = []; } else if (c.ch === " " && c.mo === undefined) flush(); else word.push(c); }
  flush(); if (cur.length) lines.push(cur);
  return lines;
}
function toLine(cs, ind){
  const l = line();
  cs.forEach((c, i) => {
    const q = l[ind + i]; if (!q) return;
    if (c.mo !== undefined){ q.mo = c.mo; q.fg = c.fg; }
    else if (c.blk === 1){ q.mo = 63; q.fg = W; }
    else if (c.blk === 2){ q.mo = 63; q.fg = W; q.y = c.ch; }
    else { q.ch = c.ch; q.fg = c.fg; }
    if (c.ln) q.ln = c.ln; if (c.fl) q.fl = 1;
  });
  return l;
}

/* ---------- documents to lines to pages ---------- */
function layout(doc, bg){
  LBG = bg || K; const out = [];
  for (const b of doc){
    if (!b) continue;
    switch (b[0]){
      case "gap": { const l = line(); l.gap = 1; out.push(l); break; }
      case "brk": out.push({brk:1}); break;
      case "band": { const l = line(b[2]); wr(l, 1, b[3], b[1]); if (b[4]){ const t = clean(b[4]); wr(l, COLS - 1 - t.length, t, b[1]); } l.keep = 1; out.push(l); break; }
      case "dh": wrap(chars(b[2], b[1]), 38).forEach(cs => { const l = toLine(cs, 1); l.dh = 1; l.keep = 1; out.push(l); }); break;
      case "p": case "foot": {
        const ind = b[3] == null ? 1 : b[3], ls = wrap(chars(b[1], b[2] == null ? W : b[2]), COLS - 1 - ind).map(cs => toLine(cs, ind));
        ls.forEach((l, i) => { l.parI = i; l.parN = ls.length; if (b[0] === "foot") l.opt = 1; out.push(l); }); break;
      }
      case "raw": b[1].forEach(l => out.push(l)); break;
      case "idx": {
        const l = line(), t = clean(b[1]); wr(l, 1, t, Y); for (let x = t.length + 2; x < 35; x++) wr(l, x, ".", B === LBG ? C : B);
        wr(l, 36, String(b[2]), W); l.forEach(c => c.ln = {t:"p", n:String(b[2])}); out.push(l); break;
      }
      case "tbl": b[1].forEach(r => { const l = line(), v = clean(r[1]); wr(l, 1, r[0], C); for (let x = clean(r[0]).length + 2; x < COLS - 2 - v.length; x++) wr(l, x, ".", B); wr(l, COLS - 1 - v.length, v, W); out.push(l); }); break;
      case "kv": {
        const ind = b[4] || 7, ls = wrap(chars(b[2], W), COLS - 2 - ind).map(cs => toLine(cs, ind));
        wr(ls[0], 1, b[1], Y, b[3] ? {ln:{t:"p", n:String(b[3])}} : null);
        ls.forEach(l => { l.grp = "kv" + b[1]; out.push(l); }); break;
      }
      case "res": {
        const a = b[1], l1 = line(), l2 = line(), ln = {t:"p", n:a.pg};
        wr(l1, 1, a.pg, b[2] ? G : Y); wr(l1, 5, SRC[a.p], C);
        if (a.wd) wr(l1, 26, "WITHDRAWN", R); else wr(l1, 26, a.ys, W);
        let h = clean(a.h); if (h.length > 34) h = h.slice(0, 32) + "..";
        wr(l2, 5, h, W);
        [l1, l2].forEach(l => { l.forEach(c => c.ln = ln); l.grp = "r" + a.pg; out.push(l); }); break;
      }
      case "opts": b[1].forEach((o, i) => {
        const ls = wrap(chars(o.t, W), 35).map(cs => toLine(cs, 4)); wr(ls[0], 1, String(i + 1), Y);
        ls.forEach(l => { l.forEach(c => c.ln = {t:"o", i}); l.grp = "o" + i; out.push(l); });
        if (!b[2]){ const g = line(); g.gap = 1; out.push(g); }      /* b[2]: a tight list, for the map and for places you search */
      }); break;
      case "task": {      /* the job in hand: black on a white bar, the same bar the reading room uses for its question */
        const lab = b[2] || "TASK", ind = lab.length + 2;
        const ls = wrap(chars(b[1], K), COLS - 1 - ind).map(cs => { const l = line(W); cs.forEach((c, j) => { const q = l[ind + j]; if (q){ q.ch = c.ch; q.fg = K; } }); return l; });
        wr(ls[0], 1, lab, B); ls.forEach(l => { l.grp = "task"; out.push(l); }); break;
      }
      case "center": { const t = clean(b[2]), l = line(); wr(l, Math.max(0, Math.floor((COLS - t.length) / 2)), t, b[1], b[4] ? {fl:1} : null); if (b[3]) l.dh = 1; out.push(l); break; }
    }
  }
  return out;
}
function paginate(lines, H){
  H = H || PH; const pages = []; let cur = [], used = 0;
  const push = () => { while (cur.length && cur[cur.length - 1].gap) cur.pop(); if (cur.length) pages.push(cur); cur = []; used = 0; };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i];
    if (l.brk){ push(); continue; }
    if (l.gap && !cur.length) continue;
    if (l.gap && lines[i + 1] && lines[i + 1].opt && used + 2 > H){ i++; continue; }      /* a slogan never gets a page to itself */
    const h = l.dh ? 2 : 1; let need = h;
    const first = x => x.parI === 0 ? (x.parN <= 5 ? x.parN : 2) : (x.dh ? 2 : 1);   /* short paragraphs stay whole */
    if (l.opt && used + 1 > H) continue;
    if (l.keep){ let j = i + 1; while (j < lines.length && !lines[j].brk && (lines[j].keep || lines[j].gap)){ need += lines[j].dh ? 2 : 1; j++; } if (j < lines.length && !lines[j].brk) need += first(lines[j]); }
    else if (l.grp && (i === 0 || lines[i - 1].grp !== l.grp)){ let j = i + 1; while (j < lines.length && lines[j].grp === l.grp){ need++; j++; } }
    else if (l.parI === 0) need = first(l);
    if (used + need > H && cur.length){ push(); if (l.gap) continue; }
    cur.push(l); used += h;
  }
  push(); if (!pages.length) pages.push([]);
  return pages;
}

/* ---------- the screen ---------- */
const cv = $("#scr"), cx = cv.getContext("2d");
let SCR = [], SC = 2, phase = 0, paintRow = 99, REV = false;
const MOS = [[0, 0, 6, 6], [6, 0, 6, 6], [0, 6, 6, 8], [6, 6, 6, 8], [0, 14, 6, 6], [6, 14, 6, 6]];
function drawRuns(runs, x0, y0, mode){
  const s = SC;
  for (let i = 0; i < runs.length; i++){
    const r = runs[i];
    if (!mode) cx.fillRect(x0 + r[0] * s, y0 + r[1] * s, r[2] * s, s);
    else if (mode === 1){ if (r[1] < 10) cx.fillRect(x0 + r[0] * s, y0 + r[1] * 2 * s, r[2] * s, 2 * s); }
    else if (r[1] >= 10) cx.fillRect(x0 + r[0] * s, y0 + (r[1] - 10) * 2 * s, r[2] * s, 2 * s);
  }
}
function draw(){
  const s = SC, cw = GW * s, ch = GH * s, flashOn = CALM || phase % 4 !== 3;
  cx.fillStyle = PAL[K]; cx.fillRect(0, 0, cv.width, cv.height);
  for (let r = 0; r < ROWS; r++){
    const row = SCR[r]; if (!row) continue;
    if (r >= 1 && r <= PH && r > paintRow) continue;
    for (let c = 0; c < COLS; c++){
      const q = row[c], x = c * cw, y = r * ch;
      if (q.bg){ cx.fillStyle = PAL[q.bg]; cx.fillRect(x, y, cw, ch); }
      if (q.fl && !flashOn) continue;
      let fg = q.fg, chh = q.ch, mo = q.mo;
      if (q.y !== undefined && REV){ mo = -1; chh = q.y; fg = Y; }
      if (mo >= 0){
        if (!mo) continue; cx.fillStyle = PAL[fg];
        for (let b = 0; b < 6; b++) if ((mo >> b) & 1){ const m = MOS[b]; if (q.sep) cx.fillRect(x + (m[0] + 1) * s, y + (m[1] + 1) * s, (m[2] - 2) * s, (m[3] - 2) * s); else cx.fillRect(x + m[0] * s, y + m[1] * s, m[2] * s, m[3] * s); }
        continue;
      }
      if (chh === " " || !chh) continue;
      cx.fillStyle = PAL[fg]; drawRuns(GL[chh] || GL["?"], x, y, q.dh || 0);
    }
  }
}

  if (sc !== SC || cv.width !== 480 * sc){ SC = sc; cv.width = 480 * sc; cv.height = 500 * sc; }

}
function keyLabel(btn, text){
  const c = document.createElement("canvas"), s = 2; c.width = text.length * GW * s; c.height = GH * s; const x = c.getContext("2d"); x.fillStyle = "#fff";

{pg:"602",p:"VC",ch:4,y:-1.15,ys:"pre-Quiet",date:"Two years before the Quiet, 1 November",

 h:"Kalder Buys the Morrow Sanatorium",by:"By F. Aster, works desk",kw:"kalder sanatorium morrow bought rest facility beds",
 b:`The Kalder Works has bought the old sanatorium at <k>Morrow Flats</k>, empty for ten years.

Kalder says it will be "a rest facility for tired workers". It has ordered four hundred beds. It employs ninety workers.

Asked who the other beds are for, a spokesman said the question was "not calm".`},
{pg:"265",p:"CB",ch:4,y:12.1,ys:"Q.Y. 12",date:"Q.Y. 12, week 10",
 h:"The Civic Reading Room Opens",kw:"reading room opens history attendant interest noted agitator",
 b:`The Civic <k>Reading Room</k> opens on Monday. Every back page will be held there, on twelve readers.

History is for everyone. Residents who take a particular interest in history will be noted by the attendant, and helped.

The Reading Room was proposed last year, after the business with the <k>agitator</k>.`},
{pg:"802",p:"LT",ch:4,y:6.6,ys:"Q.Y. 6",date:"Q.Y. 6. Held so residents can recognise it.",sheet:"sheet 2",
 h:"The Low Tide, Sheet 2: Thirty Days",kw:"low tide sheet 2 thirty days quiet f. sedition",
 b:`THIRTY DAYS.

That is how long the Quiet was meant to last. Look it up: Bulletin, Year 0, day 3. It has been two thousand days.

Nobody voted for the weather.

F.`},
{pg:"807",p:"LT",ch:4,y:10.8,ys:"Q.Y. 10",date:"Q.Y. 10. Held so residents can recognise it.",sheet:"sheet 7",
 h:"The Low Tide, Sheet 7: If They Take Me",kw:"low tide sheet 7 friend bakes feed take me f. sedition",
 b:`IF THEY TAKE ME.

They will, soon. I am told you come back, with a new name and no memory, and they put you where you were.

So I have asked a friend to look after whoever I turn into. He bakes. He says he will bring bread every week and never say why.

F.`},
{pg:"351",p:"SN",ch:4,y:11.24,ys:"Q.Y. 11",date:"Q.Y. 11, week 24",h:"Small Notices",kw:"small notices 4-12 new resident welcome walls neighbour bread",
 items:[`<b>TO THE NEW RESIDENT IN 4-12:</b> welcome. The walls are thin. Be kind to them. A neighbour.`,
        `<b>FOR SALE:</b> typewriter, no ribbon. One careful owner, lost.`,
        `<b>BREAD.</b> Rye, baked at six. Knock twice, 4-13 <k>Lantern Row</k>. I.K.`]},

{pg:"204",p:"CB",ch:5,y:0.02,ys:"Q.Y. 0",date:"Q.Y. 0, day 9",
 h:"The Lines Are Closed",kw:"outside beyond railway harbour ferry river road closed lines outlying districts family nothing",
 b:`The railway, the river road and the <k>harbour</k> are closed until the Weather clears.

The outlying districts have been lost to the weather. There is nothing beyond <k>Morrow Flats</k> at present.

Residents with family beyond Morrow Flats are asked to remember them calmly.

Do not go and look. There is nothing to see, and it is not safe to see it.`,clue:"c_nothing"},
{pg:"225",p:"CB",ch:5,y:3.3,ys:"Q.Y. 3",date:"Q.Y. 3, week 30",

Residents have asked where the tins come from. The tins come from the Administration.

Residents are asked not to read the tins.`},
{pg:"356",p:"SN",ch:5,y:8.4,ys:"Q.Y. 8",date:"Q.Y. 8, week 40",h:"Small Notices",kw:"small notices tin tins relief k.r.t. krt stamped pears box 12 train coast outside",
 items:[`<b>FOUND:</b> under a relief tin, three letters stamped in the metal: K.R.T. Does anybody know what they stand for? Reply box 12.`,
        `<b>BOX 12:</b> no. Neither do you.`,
        `<b>FOR EXCHANGE:</b> tinned pears, six, for tinned anything else.`,
        `<b>LOST:</b> the 7.15 to the coast. Last seen Q.Y. 0. Sentimental value.`]},
{pg:"606",p:"VC",ch:5,y:-0.15,ys:"pre-Quiet",date:"The last year, Tuesday 24 January",
 h:"Kalder Founds a 'Remediation Trust', Just in Case",by:"By F. Aster, works desk",kw:"kalder remediation trust ministry paid pays daily sum resident head incident fence care",
 b:`The Kalder Works has founded a new body, the Kalder Remediation <k>Trust</k>, "to care for residents in the unlikely event of an incident".

Under an agreement signed with the Ministry last week, the Trust will be paid a daily sum for every resident in its care, for as long as an incident lasts.

The Courier asked who decides when an incident is over. "The Trust's own air readers," a spokesman said.

The Trust's first purchase was eleven miles of <k>fence</k>.`,clue:"c_trust"},
{pg:"607",p:"VC",ch:2,y:-0.6,ys:"pre-Quiet",date:"The year before the Quiet, 9 August",
 h:"The Doctor Who Reads the Air",by:"By the Courier staff",kw:"oduya air office reader readings stations water cup instrument doctor",
 b:`Dr M. <k>Oduya</k>, chief reader at the <k>Air Office</k>, has read the air of Vessen every morning for nineteen years.

Dr Oduya keeps a paper cup of water beside every instrument. "If the water shakes, I read it again. An instrument can be talked into things. Water can't."

Asked what the Air Office would do if the readings were ever bad, Dr Oduya said: "Say so. Loudly. That is the whole job."`,clue:"c_cup"},
{pg:"480",p:"CG",ch:5,y:22.02,ys:"Q.Y. 22",date:"Q.Y. 22, daily",h:"Form K-1: Daily Return",kw:"return daily form k-1 care residents ministry trust census head count rate wire",

{pg:"804",p:"LT",ch:5,y:8.1,ys:"Q.Y. 8",date:"Q.Y. 8. Held so residents can recognise it.",sheet:"sheet 4",

Stamped in the base: K.R.T. Kalder Remediation <k>Trust</k>. I wrote the story the week it was founded.

Nobody in Vessen makes tins. Nobody in Vessen grows pears. Somebody outside is alive, and packing, and being paid.

There is an outside.

F.`,clue:"c_krt"},
{pg:"805",p:"LT",ch:5,y:9.1,ys:"Q.Y. 9",date:"Q.Y. 9. Held so residents can recognise it.",sheet:"sheet 5",
 h:"The Low Tide, Sheet 5: The Fence",kw:"low tide sheet 5 fence signs outward care zone afflicted east outside f. sedition",
 b:`I WALKED EAST.

Past the sealed works there is a <k>fence</k>, and on the fence there are signs. The signs face outward.

I read one from behind, through the wire: CARE ZONE. THE AFFLICTED ARE NOT TO BE APPROACHED.

The fence isn't there to keep the Weather in. It is there to keep the world from looking.

F.`,clue:"c_fence"},

function elsewhere(p, id){

  if (p === "home") opts.unshift({t:"Open your notebook.", f:() => show(Object.assign(notebookSpec(), {kind:"narr", slow:false, onEnd:() => elsewhere(p, id)}))});
  if (p === "housing" && !HERE.night && S.solved.q12 && !S.fl.clerk) opts.unshift({t:"Ask the clerk who lived in 4-12 before you.", risk:1, f:() => { flag("clerk");
    story(p, [CLERK("Nobody, resident. You have always lived in 4-12."), `The clerk said it before you had finished the question. Now they write something on the pad, tear the page off, and post it through a slot in the wall behind them.`], back); }});
  const noted = HERE.night && p !== "home";
  if (noted){ S.fl.wander = (S.fl.wander | 0) + 1; save(); }
  story(p, [pic(p)].concat(ELSE[p](HERE.night, id), noted ? [`<r>A warden's torch finds you on the way. Your flat number goes into the book.</r>`] : []), null, opts, {compact:1});
}

/* what the Administration has on you: every choice, and what it cost */

  if (f.mina) add(`Spoke to M. Hale, 18, in the square. She began to search. Lost to the weather, Sunday night. <b>She had never been re-issued before. She was the last person in Vessen who remembered being a child.</b>`, 1); else add(`M. Hale, reader 2: steady. Still reading her one page.`);
  if (f.van) add(`Followed a Sector 5 van after dark. <b>Noted.</b>`, 1);
  if (f.lshop || f.lsquare || f.lpress) add(`Seen loitering: ${[f.lshop && "a vacant shop", f.lsquare && "the siren post", f.lpress && "Press Street"].filter(Boolean).join(", ")}. <b>Noted.</b>`, 1);

  if (f.clerk) add(`Asked the Housing Office about yourself. <b>Noted.</b>`, 1);
  if (f.red) add(`Reading Room lamp reached red. <b>Noted.</b>`, 1);
  if (f.call) add(`Showed yourself to Trust staff at the harbour. <b>Noted twice.</b> One bargeman retired, unwell.`, 1);
  if (ivoGone()) add(`Used the name Kessel through a thin wall${tally(IVO) > 2 ? ", more than once" : ""}. T. Rell lost to the weather, Tuesday night. <b>4-13 is vacant. It has been vacant since Q.Y. 3.</b>`, 1);
  else add(`T. Rell, 4-13: calm. Bakes. ${f.said || f.knock ? "Heard his old name once, and let it go." : "Has never heard the name Kessel."}`);
  if (f.proof) add(`Removed one sheet from Press Street. Recovered. Filed with the others.`, 1);

}
function ending(kind){
